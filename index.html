<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Atria Institute of Technology – AI Assistant</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo-block">
        <div class="logo-icon">A</div>
        <div>
          <div class="logo-title">Atria Institute of Technology</div>
          <div class="logo-sub">AI Student Assistant</div>
        </div>
      </div>
      <div class="status-pill">
        <span class="dot"></span> Online
      </div>
    </div>
  </header>

  <!-- Chat Window -->
  <main class="chat-container">
    <div class="chat-box" id="chatBox">
      <!-- Messages injected by JS -->
    </div>

    <!-- Quick Suggestions -->
    <div class="suggestions" id="suggestions">
      <button class="chip" onclick="sendChip(this)">📚 Courses offered</button>
      <button class="chip" onclick="sendChip(this)">🎓 Admission process</button>
      <button class="chip" onclick="sendChip(this)">💼 Placements</button>
      <button class="chip" onclick="sendChip(this)">🏠 Hostel facilities</button>
      <button class="chip" onclick="sendChip(this)">📍 College location</button>
      <button class="chip" onclick="sendChip(this)">📞 Contact details</button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask me anything about Atria..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter') sendMessage()"
      />
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
